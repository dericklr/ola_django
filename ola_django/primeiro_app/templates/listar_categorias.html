{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Lista de Categorias</title>
    <link href="{% static 'css/crud/listar_pessoas.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="corpo"> 
    <h1>Categorias Cadastradas</h1>

    
    <table> 
        <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Pré-Definida</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in object_list %}
            <tr>
                <div class="info">
                    <td>{{ categoria.nome  }}</td>
                    <td>{{ categoria.descricao }}</td>
                    <td>{{categoria.categoria_predefinida}}</td>
                </div>
                <td>
                    <a href="{% url 'editar_categoria' categoria.id %}"><i class="bi bi-pencil-fill"></i></a>
                    <a href="{% url 'detalhe_categoria' categoria.id %}"><i class="bi bi-eye"></i></a>
                    <a href="{% url 'deletar_categoria' categoria.id %}"><i class="bi bi-trash"></i></a>
                </td>
                    
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="plus">
        <a href="{% url 'cadastrar_categoria' %}"><i class="bi bi-plus"></i></a>
    </div>
    <a href="{% url 'listar_pessoas' %}"> Ir para lista de pessoas</a>
</body>
</html>
