{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Adicionar Categoria</title>
    <link href="{% static 'css/crud/cadastrar_pessoas.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="novaPessoa">
        <div class="cadastraNovaPessoa">
            <h2>Editar Pessoa</h2>

            <form method="post">
                {% csrf_token %} 
                {{ form.as_p }} 
                <a href="{% url 'listar_pessoas' %}" class="btn btn-secondary"><i class="bi bi-arrow-return-left"></i></a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i></button>
            </form>
        </div>
    </div>
</body> 
</html>
