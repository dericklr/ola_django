{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Lista de Pessoas</title>
    <link href="{% static 'css/crud/listar_pessoas.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="corpo">
    <h1 id="cabecalho">Pessoas Cadastradas</h1>
    
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Tipo Pessoa</th>
                <th>Ações</th> 
            </tr>
        </thead>
        <tbody>
            {% for pessoa in object_list %}
                <tr>
                    <div class="infos">
                        <td>{{ pessoa.nome }}</td>
                        <td>{{ pessoa.idade }}</td>
                        <td>{{ pessoa.email }}</td>
                        <td>{{ pessoa.tipo_pessoa }}</td>
                    </div>
                    <td>
                        <a href="{% url 'editar_pessoa' pessoa.id %}"><i class="bi bi-pencil-fill"></i></a>
                        <a href="{% url 'detalhe_pessoa' pessoa.id %}"><i class="bi bi-eye"></i></a>
                        <a href="{% url 'deletar_pessoa' pessoa.id %}"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    
</div>
<div class="plus"><a href="{% url 'cadastrar_pessoa' %}"><i class="bi bi-plus"></i></a></div>

<a href="{% url 'listar_categorias' %}"> Ir para lista de categorias</a>
</body>
</html>
